<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{.Title}}</title>
<style>
body,table,td,a{-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}table{border-collapse:collapse}a{color:#0f766e}a:focus-visible{outline:3px solid #0f766e;outline-offset:4px}
@media only screen and (max-width:620px){.outer{padding:20px 12px!important}.pad{padding-left:22px!important;padding-right:22px!important}.headline{font-size:24px!important}.metric-value{font-size:25px!important}.metric{padding:18px 14px!important}.detail-label{width:82px!important}.brand-meta{display:none!important}}
@media(prefers-color-scheme:dark){.email-bg{background-color:#101719!important}.surface{background-color:#192326!important;border-color:#344144!important}.ink{color:#edf3f1!important}.muted{color:#aebfba!important}.soft{background-color:#223033!important}.rule{border-color:#344144!important}.mail-body p,.mail-body li,.mail-body td{color:#dce6e2!important}.mail-body h2,.mail-body h3{color:#edf3f1!important}.mail-body a{color:#77d6bd!important}}
</style>
</head>
<body class="email-bg" style="margin:0;padding:0;background-color:#f1f4f3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;color:#172b27;">
<div style="display:none;font-size:1px;color:#f1f4f3;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{.Preheader}}</div>
<table role="presentation" width="100%" class="email-bg" bgcolor="#f1f4f3" style="width:100%;background-color:#f1f4f3;">
<tr><td align="center" class="outer" style="padding:40px 20px 32px;">
<!--[if mso]><table role="presentation" width="620"><tr><td><![endif]-->
<table role="presentation" width="100%" style="width:100%;max-width:620px;">
<tr><td style="padding:0 4px 20px;">
<table role="presentation" width="100%"><tr>
<td><table role="presentation"><tr><td bgcolor="#153d34" style="width:34px;height:34px;text-align:center;background-color:#153d34;border-radius:9px;color:#ffffff;font-size:13px;font-weight:800;letter-spacing:-1px;">FR</td><td class="ink" style="padding-left:11px;font-size:13px;letter-spacing:1.8px;font-weight:750;color:#153d34;">FLOW ROUTER</td></tr></table></td>
<td align="right" class="brand-meta muted" style="font-size:12px;color:#62766f;">运营通知</td>
</tr></table>
</td></tr>
<tr><td class="surface" bgcolor="#ffffff" style="background-color:#ffffff;border:1px solid #dfe7e3;border-radius:16px;overflow:hidden;">
<table role="presentation" width="100%">
<tr><td height="4" bgcolor="{{.Theme.Color}}" style="height:4px;line-height:4px;font-size:1px;background-color:{{.Theme.Color}};">&nbsp;</td></tr>
<tr><td class="pad" style="padding:30px 34px 0;">
<table role="presentation" width="100%"><tr>
<td><span style="display:inline-block;background-color:{{.Theme.Background}};color:{{.Theme.Color}};padding:6px 11px;border-radius:6px;font-size:12px;line-height:18px;font-weight:650;">{{.Theme.Label}}</span></td>
<td align="right" class="muted" style="font-size:12px;line-height:18px;color:#62766f;">{{.Date}}</td>
</tr></table>
<h1 class="headline ink" style="margin:22px 0 10px;font-size:28px;line-height:1.4;font-weight:750;letter-spacing:-0.6px;color:#172b27;overflow-wrap:anywhere;word-break:break-word;">{{.Title}}</h1>
<p class="muted" style="margin:0;font-size:14px;line-height:1.8;color:#62766f;">{{.Description}}</p>
</td></tr>
{{if .Metrics}}<tr><td class="pad" style="padding:24px 34px 0;">
<table role="presentation" width="100%" class="soft" bgcolor="#f3f7f5" style="background-color:#f3f7f5;border-radius:10px;table-layout:fixed;"><tr>
{{range .Metrics}}<td valign="top" class="metric" style="padding:21px 20px;">
<p class="muted" style="margin:0 0 8px;font-size:12px;line-height:18px;color:#62766f;">{{.Label}}</p>
<p class="metric-value ink" style="margin:0;font-size:30px;line-height:1.25;font-weight:750;letter-spacing:-1px;color:#172b27;font-variant-numeric:tabular-nums;">{{.Value}}<span class="muted" style="font-size:12px;font-weight:500;letter-spacing:0;color:#62766f;">{{.Unit}}</span></p>
</td>{{end}}
</tr></table>
</td></tr>{{end}}
<tr><td class="pad mail-body" style="padding:26px 34px 0;font-size:14px;line-height:1.8;overflow-wrap:anywhere;word-break:break-word;">{{.Body}}</td></tr>
{{if .ActionURL}}<tr><td class="pad" style="padding:14px 34px 4px;">
<table role="presentation"><tr><td bgcolor="#153d34" style="background-color:#153d34;border-radius:8px;mso-padding-alt:14px 24px;"><a href="{{.ActionURL}}" target="_blank" style="display:inline-block;padding:14px 24px;font-size:14px;line-height:20px;font-weight:650;color:#ffffff;text-decoration:none;">{{.ActionLabel}}&nbsp; &rarr;</a></td></tr></table>
</td></tr>{{end}}
<tr><td class="pad" style="padding:26px 34px 24px;">
<table role="presentation" width="100%"><tr><td class="rule muted" style="border-top:1px solid #e6ede9;padding-top:18px;font-size:12px;line-height:1.8;color:#62766f;">{{.Footer}}</td></tr></table>
</td></tr>
</table>
</td></tr>
<tr><td align="center" class="muted" style="padding:22px 12px 0;font-size:11px;line-height:1.8;color:#62766f;">FLOW ROUTER &nbsp;·&nbsp; 渠道运营与路由监测<br>此邮件由系统自动发送，请在控制台管理通知订阅。</td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr></table>
</body></html>
